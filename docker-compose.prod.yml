services:
  app:
    build: ./backend
    container_name: rag-platform
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - OLLAMA_HOST=http://172.17.0.1:11434
      - API_KEY=${API_KEY}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen3.5:9b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - RAG_TOP_K=${RAG_TOP_K:-10}
    ports:
      - "8000:8000"
    restart: unless-stopped
